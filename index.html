<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

<h1 class="text-2xl font-bold mb-4">TaskFlow Pro</h1>

<form id="taskForm" class="flex gap-2 mb-4">
  <input id="taskInput" placeholder="Nueva tarea" class="border p-2 flex-1" required />

  <select id="priority">
    <option value="low">Baja</option>
    <option value="medium">Media</option>
    <option value="high">Alta</option>
  </select>

  <input type="date" id="dueDate" />

  <button class="bg-blue-500 text-white px-3">+</button>
</form>

<input id="searchInput" placeholder="Buscar..." class="border p-2 mb-2 w-full">

<div class="flex gap-2 mb-2">
  <button onclick="setFilter('all')" class="border px-2">Todas</button>
  <button onclick="setFilter('pending')" class="border px-2">Pendientes</button>
  <button onclick="setFilter('completed')" class="border px-2">Completadas</button>
</div>

<!-- BOTONES ARREGLADOS -->
<div class="flex gap-2 mb-2">
  <button id="completeAllBtn" class="border px-2 py-1">
    Completar todas
  </button>
  <button id="clearCompletedBtn" class="border px-2 py-1">
    Borrar completadas
  </button>
</div>

<select id="sort" class="mb-4">
  <option value="created">Ordenar por creación</option>
  <option value="priority">Ordenar por prioridad</option>
  <option value="date">Ordenar por fecha</option>
</select>

<ul id="taskList" class="space-y-2"></ul>

<div class="mt-4 flex gap-4">
  <div>Pendientes: <span id="todo">0</span></div>
  <div>Completadas: <span id="done">0</span></div>
  <div>Total: <span id="total">0</span></div>
</div>

<script>
let tasks = [];
let activeFilter = "all";
let searchQuery = "";

// ELEMENTOS
const taskForm = document.getElementById("taskForm");
const taskInput = document.getElementById("taskInput");
const priority = document.getElementById("priority");
const dueDate = document.getElementById("dueDate");
const sort = document.getElementById("sort");
const taskList = document.getElementById("taskList");
const searchInput = document.getElementById("searchInput");
const completeAllBtn = document.getElementById("completeAllBtn");
const clearCompletedBtn = document.getElementById("clearCompletedBtn");

// STORAGE
function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function load() {
  tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
}

// CREATE
function createTask(title, priority, dueDate) {
  return {
    id: crypto.randomUUID(),
    title,
    completed: false,
    priority,
    dueDate,
    createdAt: new Date()
  };
}

// ADD
function addTask(e) {
  e.preventDefault();
  const title = taskInput.value.trim();
  if (title.length < 3) return;

  tasks.push(createTask(title, priority.value, dueDate.value));
  taskInput.value = "";
  render();
}

// TOGGLE
function toggle(id) {
  const t = tasks.find(t => t.id === id);
  if (t) t.completed = !t.completed;
  render();
}

// DELETE
function remove(id) {
  tasks = tasks.filter(t => t.id !== id);
  render();
}

// FILTER
function setFilter(filter) {
  activeFilter = filter;
  render();
}

// COMPLETE ALL
function completeAll() {
  tasks.forEach(t => t.completed = true);
  render();
}

// CLEAR COMPLETED
function clearCompleted() {
  tasks = tasks.filter(t => !t.completed);
  render();
}

// SEARCH
searchInput.addEventListener("input", () => {
  searchQuery = searchInput.value;
  render();
});

// OVERDUE
function isOverdue(task) {
  if (!task.dueDate) return false;
  return !task.completed && new Date(task.dueDate) < new Date();
}

// SORT
function sortTasks(list) {
  const type = sort.value;

  if (type === "priority") {
    const order = { high: 3, medium: 2, low: 1 };
    return list.sort((a,b) => order[b.priority] - order[a.priority]);
  }

  if (type === "date") {
    return list.sort((a,b) => new Date(a.dueDate||0) - new Date(b.dueDate||0));
  }

  return list.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
}

// STATS + MEJORA PRO
function updateStats() {
  const total = tasks.length;
  const done = tasks.filter(t => t.completed).length;

  document.getElementById("total").textContent = total;
  document.getElementById("done").textContent = done;
  document.getElementById("todo").textContent = total - done;

  // MEJORA PRO
  completeAllBtn.disabled = total === 0;
  clearCompletedBtn.disabled = done === 0;
}

// RENDER
function render() {
  taskList.innerHTML = "";

  let list = [...tasks];

  if (activeFilter === "pending") list = list.filter(t => !t.completed);
  if (activeFilter === "completed") list = list.filter(t => t.completed);

  if (searchQuery) {
    list = list.filter(t =>
      t.title.toLowerCase().includes(searchQuery.toLowerCase())
    );
  }

  list = sortTasks(list);

  list.forEach(task => {
    const li = document.createElement("li");
    li.className = "p-2 border flex justify-between";

    const left = document.createElement("div");

    const title = document.createElement("span");
    title.textContent = task.title;

    if (task.completed) title.style.textDecoration = "line-through";
    if (task.priority === "high") title.classList.add("text-red-500");
    if (task.priority === "medium") title.classList.add("text-yellow-500");

    if (isOverdue(task)) {
      title.classList.add("font-bold");
      title.textContent += " ⚠️";
    }

    const date = document.createElement("div");
    date.textContent = task.dueDate || "Sin fecha";
    date.className = "text-xs";

    left.appendChild(title);
    left.appendChild(date);

    const right = document.createElement("div");

    const btnToggle = document.createElement("button");
    btnToggle.textContent = "✔";
    btnToggle.onclick = () => toggle(task.id);

    const btnDelete = document.createElement("button");
    btnDelete.textContent = "✕";
    btnDelete.onclick = () => remove(task.id);

    right.appendChild(btnToggle);
    right.appendChild(btnDelete);

    li.appendChild(left);
    li.appendChild(right);

    taskList.appendChild(li);
  });

  updateStats();
  save();
}

// INIT
load();
render();

// EVENTS
taskForm.addEventListener("submit", addTask);
sort.addEventListener("change", render);
completeAllBtn.addEventListener("click", completeAll);
clearCompletedBtn.addEventListener("click", clearCompleted);
</script>

</body>
</html>
